body{background:var(--bg);color:var(--ink);font-family:'Courier New',monospace;max-width:430px;margin:0 auto;min-height:100vh;}
.hdr{background:#fff;padding:16px 16px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.hdr-lbl{font-size:9px;letter-spacing:4px;color:var(--red);font-weight:700;margin-bottom:3px;}
.hdr-date{font-size:16px;font-weight:700;}
.hdr-quote{font-size:10px;color:var(--muted);margin-top:2px;font-style:italic;}
.acircle{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:3px solid var(--green);}
.apct{font-size:13px;font-weight:800;color:var(--green);line-height:1;}
.albl{font-size:7px;color:var(--faint);margin-top:2px;letter-spacing:1px;}
.stats{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;}
.stat{flex:1;min-width:50px;background:var(--bg);border-radius:10px;padding:7px 3px;text-align:center;border:1px solid var(--border);}
.sv{font-size:11px;font-weight:700;}
.sl{font-size:7px;color:var(--faint);letter-spacing:1px;margin-top:1px;}
.tabs{display:flex;overflow-x:auto;margin:0 -16px;padding:0 16px;}
.tab{padding:10px 10px;border:none;background:transparent;font-size:9px;letter-spacing:1px;font-family:inherit;cursor:pointer;white-space:nowrap;font-weight:400;color:var(--faint);border-bottom:2.5px solid transparent;}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:700;}
.content{padding:16px 16px 100px;}
.slbl{font-size:9px;letter-spacing:3px;color:var(--faint);margin-bottom:10px;font-weight:700;}
.card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);border:1px solid var(--border);margin-bottom:10px;}
.si{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--border);margin-bottom:6px;}
.si.ok{background:var(--green-lt);border-color:rgba(42,157,92,0.3);}
.si.late{background:var(--amber-lt);border-color:rgba(217,119,6,0.3);}
.si-icon{font-size:20px;min-width:28px;text-align:center;padding-top:2px;}
.si-body{flex:1;}
.si-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.si-lbl{font-size:13px;font-weight:500;flex:1;}
.si-lbl.done{font-weight:700;}
.si-t{font-size:9px;font-weight:700;flex-shrink:0;}
.si-d{font-size:10px;color:var(--muted);margin-top:2px;}
.si-n{font-size:9px;color:var(--amber);margin-top:2px;font-style:italic;}
.lbtn{border:none;border-radius:8px;color:#fff;font-size:10px;padding:8px 14px;cursor:pointer;font-family:inherit;font-weight:700;flex-shrink:0;min-width:50px;text-align:center;-webkit-appearance:none;display:block;margin-top:6px;}
.iform{background:var(--bg);border-radius:10px;padding:14px;margin-top:8px;border:1px solid var(--border);}
.flbl{font-size:9px;color:var(--faint);margin-bottom:4px;letter-spacing:1px;display:block;}
input[type=text],input[type=number],input[type=time]{background:#fff;border:1.5px solid var(--border);color:var(--ink);padding:11px 12px;border-radius:8px;font-size:15px;font-family:inherit;width:100%;-webkit-appearance:none;appearance:none;outline:none;display:block;}

.hb{flex:1;border-radius:10px;padding:14px;font-size:22px;cursor:pointer;border:none;font-family:inherit;-webkit-appearance:none;}
.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--border);padding:8px 20px;text-align:center;}

.tsub{font-size:10px;color:var(--muted);text-align:center;margin-bottom:16px;}

.gcat{margin-bottom:18px;}
.gcat-hdr{font-size:10px;letter-spacing:2px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:8px;}
.gitem{border-radius:10px;background:#fff;border:1px solid var(--border);margin-bottom:6px;overflow:hidden;}
.gitem.checked{background:var(--green-lt);border-color:rgba(42,157,92,0.3);}
.gitem.monthly{background:#F5F3FF;border-color:rgba(124,58,237,0.2);}

.gitem.checked .gcheck{background:var(--green);border-color:var(--green);color:#fff;}
.gname{font-size:13px;flex:1;line-height:1.3;}
.gitem.checked .gname{color:var(--muted);}
.gqty{font-size:10px;color:var(--muted);font-weight:600;flex-shrink:0;}
.gdish{font-size:9px;color:var(--faint);margin-top:2px;font-style:italic;}
.gprice-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--border);background:rgba(0,0,0,0.02);}
.gprice-lbl{font-size:10px;color:var(--muted);flex:1;}
.gprice-input{width:90px;padding:6px 10px;font-size:13px;border:1.5px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);font-family:inherit;-webkit-appearance:none;outline:none;}
.gflag{font-size:8px;padding:2px 5px;border-radius:4px;font-weight:700;flex-shrink:0;}
.hidden{display:none!important;}
.time-note{font-size:10px;color:var(--muted);margin-top:6px;font-style:italic;}
</style>

// LIVE NUDGE — what should you be doing right now
function getLiveNudge(){
  const t=now();
  const h=parseInt(t.split(':')[0]),m=parseInt(t.split(':')[1]);
  const mins=h*60+m;

  // Find current scheduled task
  let current=null,next=null,overdue=[];
  for(let i=0;i<sched.length;i++){
    const item=sched[i];
    const it=item.t;
    const ih=parseInt(it.split(':')[0]),im=parseInt(it.split(':')[1]);
    const imins=ih*60+im;
    const logged=td().sc[item.id];

    // Check overdue — scheduled more than 15 min ago and not logged
    if(!logged && imins+15 < mins && item.id!=='sleep'){
      overdue.push(item);
    }

    // Find what should be happening now
    if(imins<=mins){
      current=item;
    } else if(!next){
      next=item;
    }
  }
  return {current,next,overdue};
}

function getNudgeMsg(current,next,overdue){
  const t=now();
  const h=parseInt(t.split(':')[0]),m=parseInt(t.split(':')[1]);
  const mins=h*60+m;

  let msg='',color='#2A9D5C',bg='#EDF7F2',urgent=false;

  if(current){
    const logged=td().sc[current.id];
    if(!logged){
      // Should be doing this right now
      msg=`🔴 RIGHT NOW: ${current.l} — scheduled at ${current.t}. Not done yet.`;
      color='#E8402A';bg='#FEF0ED';urgent=true;
    } else {
      // Current task done, next coming up
      if(next){
        const nt=next.t;
        const nh=parseInt(nt.split(':')[0]),nm=parseInt(nt.split(':')[1]);
        const nmins=nh*60+nm;
        const diff=nmins-mins;
        if(diff<=15){
          msg=`⏰ COMING UP IN ${diff} MIN: ${next.l} — be ready.`;
          color='#D97706';bg='#FFFBEB';
        } else {
          msg=`✅ On track. Next: ${next.l} at ${next.t}`;
          color='#2A9D5C';bg='#EDF7F2';
        }
      } else {
        msg='✅ All scheduled tasks done. Great day.';
        color='#2A9D5C';bg='#EDF7F2';
      }
    }
  }

  // Special time-based messages
  const h2=parseInt(t.split(':')[0]);
  if(h2>=22){msg='🌙 You should be sleeping. Lights out was 10:15 PM.';color='#8A8070';bg='#F7F5F0';}
  else if(h2>=21&&h2<22){msg='📞 Family calls window. Max 30 min. Sleep at 10:15 PM.';color='#7C3AED';bg='#F5F3FF';}

  return {msg,color,bg,urgent,overdue};
}

function confirmLog(id,skipped=false){
  const timeVal=document.getElementById('lt_'+id)?.value||now();

  const item=sched.find(i=>i.id===id);
  // 15 minute buffer — within 15 mins of scheduled = on time
  const [sh,sm]=item.t.split(':').map(Number);
  const [lh,lm]=timeVal.split(':').map(Number);
  const schedMins=sh*60+sm;

  td().sc[id]={time:timeVal,note,status};

function rReports(){
  const el=document.getElementById('tab-reports');
  // Gather last 7 days data
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const yr=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');
    const key=`${yr}-${mo}-${dy}`;
    const dd=D[key];
    if(dd){
      const dow2=d.getDay();
      const sc2=getSched(dow2);
      const done=sc2.filter(s=>dd.sc[s.id]&&dd.sc[s.id].status!=='skipped').length;
      const skipped=sc2.filter(s=>dd.sc[s.id]?.status==='skipped').length;
      const al=Math.round((done+(skipped*0.5))/sc2.length*100);
      const cal=dd.food.reduce((s,f)=>s+f.cal,0);
      const spent=dd.fin.reduce((s,e)=>s+e.amt,0);
      const sm=dd.study.reduce((s,x)=>s+x.mins,0);

      const wt=dd.h?.wt||0;
      days.push({date:d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}),dow:dow2,al,cal,spent,sm,wt,key});
    }
  }

  const avgAl=days.length?Math.round(days.reduce((s,d)=>s+d.al,0)/days.length):0;
  const avgCal=days.length?Math.round(days.reduce((s,d)=>s+d.cal,0)/days.length):0;

  const totalStudy=days.reduce((s,d)=>s+d.sm,0);
  const totalSpent=days.reduce((s,d)=>s+d.spent,0);
  const bestDay=days.length?days.reduce((a,b)=>a.al>b.al?a:b):null;
  const worstDay=days.length?days.reduce((a,b)=>a.al<b.al?a:b):null;

  const acAl=avgAl>=80?'#2A9D5C':avgAl>=60?'#D97706':'#E8402A';

  let h=`<div class="slbl">WEEKLY SUMMARY</div>

    <div style="font-size:11px;color:#8A8070;margin-top:6px">Based on ${days.length} days of data</div>

    <div class="card" style="text-align:center;padding:12px">
      <div style="font-size:9px;color:#D97706;letter-spacing:2px;font-weight:700">AVG CAL</div>

  </div>

  ${bestDay?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
    <div class="card" style="background:#EDF7F2;border-color:#2A9D5C44;padding:12px">

  <div class="slbl" style="margin-top:6px">DAILY BREAKDOWN</div>`;

  days.forEach(d=>{

    </div>`;
  }

  el.innerHTML=h;
}

function setSpecialDay(type){
  const s=getSettings();
  s.specialday={type,date:tKey()};
  saveSettings();
  rSettings();
  // Also refresh today tab
  if(curTab==='today') rToday();
}

function clearSpecialDay(){
  const s=getSettings();
  s.specialday=null;
  saveSettings();
  rSettings();
  if(curTab==='today') rToday();
}

function toggleOfficeDay(d){
  const s=getSettings();
  const idx=s.officedays.indexOf(d);
  if(idx>=0) s.officedays.splice(idx,1);
  else s.officedays.push(d);
  // WFH = non-office, non-weekend (Sat/Sun)
  s.wfhdays=[0,1,2,3,4,5,6].filter(x=>!s.officedays.includes(x)&&x!==0&&x!==6);
  saveSettings();
  rSettings();
}

function toggleMBADay(d){
  const s=getSettings();
  const idx=s.mbadays.indexOf(d);
  if(idx>=0) s.mbadays.splice(idx,1);
  else s.mbadays.push(d);
  saveSettings();
  rSettings();
}

function updateMBATime(val){
  const s=getSettings();
  s.mbastarttime=val;
  saveSettings();
}

function updateBudget(val){
  const s=getSettings();
  s.dailybudget=parseInt(val)||107;
  // Also update monthbudget
  const mk2='monthbudget_'+monthKey();
  if(!D[mk2])D[mk2]={};
  D[mk2].daily=s.dailybudget;
  saveSettings();
}

// Generate 7-day meal plan based on fridge contents
function generateMealPlan(availableVeg, availableProtein, isEmpty){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const plan=[];
  
  // Sort vegetables by perishability (most perishable first)
  const sortedVeg=[...availableVeg].sort((a,b)=>{
    const ai=PERISHABLE_ORDER.indexOf(a);
    const bi=PERISHABLE_ORDER.indexOf(b);
    return (ai===-1?99:ai)-(bi===-1?99:bi);
  });

  // Track which vegs have been used
  const vegUsage={};
  availableVeg.forEach(v=>vegUsage[v]=0);

  const usedMealNames=new Set();
  const usedVegOnDay={};

  // Helper: find meal that uses given veg
  function findMealForVeg(veg, dayIdx){
    const allMeals=[...MEAL_LIB.veg,...MEAL_LIB.odia,...MEAL_LIB.dal,...MEAL_LIB.paneer];
    const shuffled=allMeals.sort(()=>Math.random()-0.5);
    
    for(const meal of shuffled){
      if(usedMealNames.has(meal.name)) continue;
      
      // Check veg requirement
      if(meal.veg.length===0){
        // Dal/legume based - always works
        if(meal.protein==='paneer'&&!availableProtein.includes('paneer')) continue;
        return meal;
      }
      
      // Check if meal needs specific veg we have
      const needed=meal.veg.filter(v=>availableVeg.includes(v));
      if(needed.length>0||(meal.minVeg&&needed.length>=meal.minVeg)){
        // Check no veg conflict on this day
        const dayVeg=usedVegOnDay[dayIdx]||[];
        const conflict=needed.some(v=>dayVeg.includes(v));
        if(!conflict){
          return meal;
        }
      }
    }
    return null;
  }

  // Helper: get best available meal
  function getBestMeal(dayIdx, preferVeg){
    // Try to use a vegetable that hasn't been used yet
    for(const veg of sortedVeg){
      if(vegUsage[veg]<2){ // Don't use same veg more than twice
        const meal=findMealForVeg(veg, dayIdx);
        if(meal){
          meal.veg.forEach(v=>{
            if(availableVeg.includes(v)){
              vegUsage[v]=(vegUsage[v]||0)+1;
              if(!usedVegOnDay[dayIdx])usedVegOnDay[dayIdx]=[];
              usedVegOnDay[dayIdx].push(v);
            }
          });
          usedMealNames.add(meal.name);
          return meal;
        }
      }
    }
    
    // Fallback: any unused meal
    const allTypes=[...MEAL_LIB.dal,...MEAL_LIB.legume,...MEAL_LIB.veg];
    const unused=allTypes.filter(m=>!usedMealNames.has(m.name));
    if(unused.length>0){
      const meal=unused[Math.floor(Math.random()*unused.length)];
      usedMealNames.add(meal.name);
      return meal;
    }
    
    // Last resort
    return MEAL_LIB.dal[0];
  }

  // Get random breakfast
  const bfastUsed=new Set();
  function getBreakfast(){
    const available=BFAST_LIB.filter(b=>!bfastUsed.has(b.name));
    if(!available.length){bfastUsed.clear();}
    const pick=available[Math.floor(Math.random()*available.length)];
    bfastUsed.add(pick.name);
    return pick;
  }

  // Generate plan for 7 days
  for(let i=0;i<7;i++){
    // Saturday (index 5 = Saturday in Mon-Sun array) is LOCKED
    if(i===5){
      const satMeal=MEAL_LIB.saturday;
      const bfast=getBreakfast();
      plan.push({
        day:days[i],
        breakfast:bfast,
        lunch:{...satMeal,portion:satMeal.g,cal:Math.round(satMeal.c*satMeal.g)},
        dinner:{...satMeal,portion:Math.round(satMeal.g*0.65),cal:Math.round(satMeal.c*satMeal.g*0.65),note:"Half carbs. No curd."},
        soakTonight:null,
        locked:true,
      });
      continue;
    }
    const meal=getBestMeal(i);
    const bfast=getBreakfast();
    
    // Check if meal needs soaking day before
    let soakTonight=null;
    if(i<6){
      const nextMeal=getBestMeal(i+1);
      if(nextMeal&&nextMeal.soak) soakTonight=nextMeal.soakItem;
    }

    plan.push({
      day:days[i],
      breakfast:bfast,
      lunch:{...meal, portion:meal.g, cal:Math.round(meal.c*meal.g)},
      dinner:{...meal, portion:Math.round(meal.g*0.65), cal:Math.round(meal.c*meal.g*0.65), note:"Half carbs. No curd."},
      soakTonight,
    });
  }

  return plan;
}

// Generate grocery list from meal plan
function generateGroceryList(plan, availableVeg){
  const needed=new Set();
  
  // Always need pantry staples
  ['sattu','poha','murmura','ragi','bread','peanut_butter','banana','curd','toor_dal',
   'masoor_dal','moong_dal','rice','atta','peanuts','papad','stress_gum'].forEach(i=>needed.add(i));

  // Add items from meal plan
  plan.forEach(day=>{
    const meal=day.lunch;
    // Add protein source
    if(meal.protein&&meal.protein!=='dal'&&meal.protein!=='none'){
      needed.add(meal.protein);
    }
    // Add vegetables not in fridge
    meal.veg.forEach(v=>{
      if(!availableVeg.includes(v)) needed.add(v);
    });
  });

  // Remove what's already in fridge
  availableVeg.forEach(v=>needed.delete(v));

  // Build grocery list by category
  const byCategory={};
  needed.forEach(item=>{
    const info=GROCERY_DB[item];
    if(!info) return;
    if(!byCategory[info.cat]) byCategory[info.cat]={};
    byCategory[info.cat][item]=info;
  });

  return byCategory;
}

  </div>`;

  Object.entries(grocery).forEach(([cat,items])=>{
    h+=`<div style="margin-bottom:12px"><div style="font-size:10px;letter-spacing:2px;font-weight:700;color:#8A8070;margin-bottom:6px">${cat}</div>`;
    Object.entries(items).forEach(([id,info])=>{
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#fff;border-radius:8px;border:1px solid #EDE9E0;margin-bottom:4px">
        <div><div style="font-size:12px;font-weight:500">${info.name}</div>${info.flag?`<div style="font-size:9px;color:#E8402A;font-weight:700;margin-top:1px">${info.flag}</div>`:''}</div>
        <div style="font-size:11px;color:#8A8070;font-weight:600">${info.qty}</div>
      </div>`;
    });
    h+=`</div>`;
  });

  el.innerHTML=h;
}

function toggleFridgeVeg(id){
  const fd=getFridgeData();
  if(!fd.veg)fd.veg=[];
  const idx=fd.veg.indexOf(id);
  if(idx>=0) fd.veg.splice(idx,1);
  else fd.veg.push(id);
  save();rFridge();
}

function toggleFridgeProtein(id){
  const fd=getFridgeData();
  if(!fd.protein)fd.protein=[];
  const idx=fd.protein.indexOf(id);
  if(idx>=0) fd.protein.splice(idx,1);
  else fd.protein.push(id);
  save();rFridge();
}

function generateWithFridge(){
  const fd=getFridgeData();
  const veg=fd.veg||[];
  const protein=fd.protein||[];
  const plan=generateMealPlan(veg,protein,false);
  fd.plan=plan;
  fd.weekKey=weekKey();
  fd.availableVeg=veg;
  fd.showSetup=false;
  save();
  rFridge();
  // Also update food tab
  updateFoodFromPlan(plan);
}

function generateEmpty(){
  const plan=generateMealPlan([],[],true);
  const fd=getFridgeData();
  fd.plan=plan;
  fd.weekKey=weekKey();
  fd.availableVeg=[];
  fd.showSetup=false;
  save();
  rFridge();
  updateFoodFromPlan(plan);
}

function updateFoodFromPlan(plan){
  // Store generated plan so Food tab can use it
  D['weekplan_'+weekKey()]=plan;
  save();
}

function getTodayMeal(){
  const plan=D['weekplan_'+weekKey()];
  if(!plan) return null;
  const today=new Date().getDay();
  const dayMap={1:0,2:1,3:2,4:3,5:4,6:5,0:6};
  return plan[dayMap[today]||0];
}

load();rToday();uHdr();
