<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life OS">
<title>Sumesh Life OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F7F5F0;--card:#FFF;--border:#EDE9E0;--ink:#1A1814;
  --muted:#8A8070;--faint:#C5BFB0;
  --red:#E8402A;--red-lt:#FEF0ED;
  --green:#2A9D5C;--green-lt:#EDF7F2;
  --amber:#D97706;--amber-lt:#FFFBEB;
  --blue:#2563EB;--blue-lt:#EFF6FF;
  --purple:#7C3AED;--purple-lt:#F5F3FF;
  --orange:#EA580C;--orange-lt:#FFF7ED;
  --teal:#0D9488;--teal-lt:#F0FDFA;
}
body{background:var(--bg);color:var(--ink);font-family:'Courier New',monospace;max-width:430px;margin:0 auto;min-height:100vh;}
.hdr{background:#fff;padding:16px 16px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.hdr-lbl{font-size:9px;letter-spacing:4px;color:var(--red);font-weight:700;margin-bottom:3px;}
.hdr-date{font-size:16px;font-weight:700;}
.hdr-quote{font-size:10px;color:var(--muted);margin-top:2px;font-style:italic;}
.acircle{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:3px solid var(--green);background:#EDF7F233;}
.apct{font-size:13px;font-weight:800;color:var(--green);line-height:1;}
.albl{font-size:7px;color:var(--faint);margin-top:2px;letter-spacing:1px;}
.stats{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;}
.stat{flex:1;min-width:50px;background:var(--bg);border-radius:10px;padding:7px 3px;text-align:center;border:1px solid var(--border);}
.sv{font-size:11px;font-weight:700;}
.sl{font-size:7px;color:var(--faint);letter-spacing:1px;margin-top:1px;}
.tabs{display:flex;overflow-x:auto;margin:0 -16px;padding:0 16px;}
.tab{padding:10px 10px;border:none;background:transparent;font-size:9px;letter-spacing:1px;font-family:inherit;cursor:pointer;white-space:nowrap;font-weight:400;color:var(--faint);border-bottom:2.5px solid transparent;}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:700;}
.content{padding:16px 16px 100px;}
.slbl{font-size:9px;letter-spacing:3px;color:var(--faint);margin-bottom:10px;font-weight:700;}
.card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);border:1px solid var(--border);margin-bottom:10px;}
.si{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--border);margin-bottom:6px;}
.si.ok{background:var(--green-lt);border-color:rgba(42,157,92,0.3);}
.si.late{background:var(--amber-lt);border-color:rgba(217,119,6,0.3);}
.si-icon{font-size:20px;min-width:28px;text-align:center;padding-top:2px;}
.si-body{flex:1;}
.si-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.si-lbl{font-size:13px;font-weight:500;flex:1;}
.si-lbl.done{font-weight:700;}
.si-t{font-size:9px;font-weight:700;flex-shrink:0;}
.si-d{font-size:10px;color:var(--muted);margin-top:2px;}
.si-n{font-size:9px;color:var(--amber);margin-top:2px;font-style:italic;}
.lbtn{border:none;border-radius:8px;color:#fff;font-size:10px;padding:8px 14px;cursor:pointer;font-family:inherit;font-weight:700;flex-shrink:0;min-width:50px;text-align:center;-webkit-appearance:none;display:block;margin-top:6px;}
.iform{background:var(--bg);border-radius:10px;padding:14px;margin-top:8px;border:1px solid var(--border);}
.flbl{font-size:9px;color:var(--faint);margin-bottom:4px;letter-spacing:1px;display:block;}
input[type=text],input[type=number],input[type=time]{background:#fff;border:1.5px solid var(--border);color:var(--ink);padding:11px 12px;border-radius:8px;font-size:15px;font-family:inherit;width:100%;-webkit-appearance:none;appearance:none;outline:none;display:block;}
.brow{display:flex;gap:8px;margin-top:12px;}
.bp{flex:1;border:none;border-radius:8px;color:#fff;padding:13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-appearance:none;}
.bs{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:8px;color:var(--muted);padding:13px;font-size:12px;cursor:pointer;font-family:inherit;-webkit-appearance:none;}
.abtn{width:100%;background:var(--card);border:1.5px dashed var(--border);border-radius:12px;padding:14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;-webkit-appearance:none;display:block;}
.pill{font-size:9px;padding:3px 8px;border-radius:20px;font-weight:700;display:inline-block;}
.pt{border-radius:6px;height:6px;margin:8px 0;}
.pf{height:6px;border-radius:6px;transition:width 0.4s;}
.hbtns{display:flex;gap:8px;margin-top:12px;}
.hb{flex:1;border-radius:10px;padding:14px;font-size:22px;cursor:pointer;border:none;font-family:inherit;-webkit-appearance:none;}
.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--border);padding:8px 20px;text-align:center;}
.tdsp{font-size:48px;font-weight:800;text-align:center;letter-spacing:3px;margin:8px 0;}
.tsub{font-size:10px;color:var(--muted);text-align:center;margin-bottom:16px;}
.rbox{background:#f8f8f8;padding:12px 14px;border-radius:8px;font-family:monospace;font-size:11px;line-height:2.2;}
.irow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);}
.cbtn{padding:7px 12px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:11px;font-family:inherit;font-weight:700;background:var(--bg);color:var(--muted);-webkit-appearance:none;}
/* GROCERY */
.gcat{margin-bottom:18px;}
.gcat-hdr{font-size:10px;letter-spacing:2px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:8px;}
.gitem{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#fff;border-radius:10px;border:1px solid var(--border);margin-bottom:6px;cursor:pointer;}
.gitem.checked{background:var(--green-lt);border-color:rgba(42,157,92,0.3);}
.gcheck{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
.gitem.checked .gcheck{background:var(--green);border-color:var(--green);color:#fff;}
.gname{font-size:13px;flex:1;}
.gitem.checked .gname{text-decoration:line-through;color:var(--muted);}
.gqty{font-size:11px;color:var(--muted);font-weight:600;}
.gflag{font-size:9px;padding:2px 6px;border-radius:4px;background:#FFFBEB;color:#D97706;font-weight:700;margin-left:4px;}
.hidden{display:none!important;}
.time-note{font-size:10px;color:var(--muted);margin-top:6px;font-style:italic;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-top">
    <div>
      <div class="hdr-lbl">SUMESH · LIFE OS</div>
      <div class="hdr-date" id="hDate"></div>
      <div class="hdr-quote" id="hQuote"></div>
    </div>
    <div style="text-align:center">
      <div class="acircle" id="aCircle"><div class="apct" id="aPct">0%</div></div>
      <div class="albl">ALIGNED</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="sv" id="sTasks">0/0</div><div class="sl">TASKS</div></div>
    <div class="stat"><div class="sv" id="sCal">0</div><div class="sl">CAL</div></div>

    <div class="stat"><div class="sv" id="sGum">0</div><div class="sl">GUM</div></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('today')">☀️ Today</button>
    <button class="tab" onclick="showTab('food')">🍽️ Food</button>
    <button class="tab" onclick="showTab('study')">📚 Study</button>
    <button class="tab" onclick="showTab('health')">💪 Health</button>
    <button class="tab" onclick="showTab('finance')">💰 Finance</button>
    <button class="tab" onclick="showTab('insights')">✨ Insights</button>
    <button class="tab" onclick="showTab('grocery')">🛒 Grocery</button>
  </div>
</div>
<div class="content">
  <div id="tab-today"></div>
  <div id="tab-food" class="hidden"></div>
  <div id="tab-study" class="hidden"></div>
  <div id="tab-health" class="hidden"></div>
  <div id="tab-finance" class="hidden"></div>
  <div id="tab-insights" class="hidden"></div>
  <div id="tab-grocery" class="hidden"></div>
</div>
<div class="bbar"><div style="font-size:9px;color:var(--faint);letter-spacing:2px" id="bDate"></div></div>

<script>
const SK='sumesh_v6',TC=1700,DB=167;
const QT=["Every small step counts. 🌱","You showed up. That's already winning. 💪","Discipline is freedom. Keep going. 🔥","One day at a time. You've got this. ☀️","Progress over perfection. Always. ✨","Your future self is watching. Make them proud. 🎯","Small habits. Big life. 🌟"];
const DNS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DSH=["SUN","MON","TUE","WED","THU","FRI","SAT"];

// GROCERY DATA
const GROCERY = [
  {cat:"🌾 Staples & Grains", color:"#D97706", bg:"#FFFBEB", items:[
    {n:"Sattu (Bengal gram flour)", q:"500g"},

  ]},
  {cat:"🍌 Fruits", color:"#7C3AED", bg:"#F5F3FF", items:[
    {n:"Bananas", q:"6–8 pcs"},

  {cat:"🫙 Condiments & Extras", color:"#0D9488", bg:"#F0FDFA", items:[
    {n:"Peanut butter", q:"1 jar (if running low)"},

    {n:"Papad", q:"1 pack"},

  {cat:"🟢 Health & Essentials", color:"#E8402A", bg:"#FEF0ED", items:[
    {n:"Nicotine gum 2mg", q:"1 pack", flag:"NON-NEGOTIABLE"},

];

const FP={
  0:{b:{n:"Vegetable Sandwich (2 slices)",c:2.5,g:120},l:{n:"Vegetable Pulao + Raita",c:1.4,g:300},d:{n:"Vegetable Pulao (half portion)",c:1.4,g:150}},
  1:{b:{n:"Sattu + Water + Banana",c:2.8,g:100},l:{n:"Dal Tadka + Rice + Cabbage Sabzi",c:1.5,g:300},d:{n:"Dal + Cabbage Sabzi (half rice)",c:1.5,g:200}},
  2:{b:{n:"Poha (small) + Curd",c:1.3,g:200},l:{n:"Chole + Chapati + Salad",c:1.8,g:250},d:{n:"Chole + 1 Chapati + Salad",c:1.8,g:170}},
  3:{b:{n:"Bread 2 slices + Peanut Butter",c:3.0,g:90},l:{n:"Chana Curry + Rice + Salad",c:1.5,g:300},d:{n:"Chana Curry + half Rice + Salad",c:1.5,g:200}},
  4:{b:{n:"Murmura + Curd",c:1.5,g:120},l:{n:"Rajma + Chapati + Onion Salad",c:1.8,g:250},d:{n:"Rajma + 1 Chapati + Salad",c:1.8,g:170}},
  5:{b:{n:"Ragi Sattu + Water + Banana",c:2.7,g:100},l:{n:"Mixed Veg Curry + Rice + Curd",c:1.4,g:300},d:{n:"Mixed Veg Curry + half Rice",c:1.4,g:200}},
  6:{b:{n:"Banana + Milk + Sattu",c:1.8,g:180},l:{n:"Paneer Bhurji + 2 Chapati + Salad",c:2.0,g:280},d:{n:"Paneer Bhurji + 1 Chapati + Salad",c:2.0,g:190}},
};
const SP={
  0:{s:"SAP HCM",t:"Review + Notes from this week",c:"#0D9488"},
  1:{s:"MBA",t:"MBA Portal — Module Reading",c:"#7C3AED"},
  2:{s:"SAP HCM",t:"Org Management — Org Units + Structure",c:"#0D9488"},
  3:{s:"MBA",t:"Excel — Pivot Tables Practice",c:"#7C3AED"},
  4:{s:"SAP HCM",t:"Personnel Admin — Master Data Concepts",c:"#0D9488"},
  5:{s:"MBA",t:"Finance Basics — P&L Statement",c:"#7C3AED"},
  6:{s:"MBA",t:"MBA Live Session / Module Prep",c:"#7C3AED"},
};
const EC={"Food":{i:"🍱",c:"#2A9D5C"},"Transport":{i:"⛽",c:"#D97706"},"Groceries":{i:"🛒",c:"#2563EB"},"Utilities":{i:"💡",c:"#7C3AED"},"Personal":{i:"🛍️",c:"#EA580C"},"Health":{i:"💊",c:"#E8402A"},"Other":{i:"📦",c:"#8A8070"}};

function getSched(dow){
  const iO=[1,3,5].includes(dow),iW=[2,4].includes(dow),iWE=[0,6].includes(dow);
  const b=[
    {id:"wake",t:"05:00",l:"Wake Up",i:"⏰",d:"Water + nicotine gum immediately.",a:"#D97706"},
    {id:"broom",t:"05:05",l:"Brooming — 2BHK",i:"🧹",d:"Full house. 15 minutes.",a:"#0D9488"},
    {id:"walk",t:"05:25",l:`Walk ${iWE?45:30} min`,i:"🚶",d:"No phone. Steady pace.",a:"#2A9D5C"},
    {id:"bath",t:"06:00",l:"Bath",i:"🚿",d:"Quick. 15 minutes.",a:"#2563EB"},
    {id:"prayer",t:"06:15",l:"Prayer",i:"🙏",d:"10 minutes. Do not skip.",a:"#7C3AED"},
    {id:"cook",t:"06:30",l:"Cook Lunch + Dinner",i:"🍲",d:"Double quantity. Dinner in fridge.",a:"#EA580C"},
    {id:"bfast",t:"07:25",l:"Breakfast",i:"🥣",d:"As per today's plan. Eat it.",a:"#D97706"},
    {id:"wash1",t:"07:40",l:"Wash Utensils",i:"🧽",d:"Kitchen clean before leaving.",a:"#0D9488"},
  ];
  if(iO) b.push(
    {id:"leave",t:"08:00",l:"Get Ready + Leave",i:"🏢",d:"Hard limit 8:30 AM.",a:"#2563EB"},
    {id:"dinner",t:"20:05",l:"Dinner (from fridge)",i:"🍽️",d:"Half carbs. No curd at night.",a:"#EA580C"},
    {id:"wash2",t:"20:25",l:"Wash Utensils",i:"🧽",d:"10 minutes. Done.",a:"#0D9488"},
    {id:"study",t:"20:45",l:"Study — MBA (1 hr)",i:"📚",d:"Phone away. Start now.",a:"#7C3AED"},
    {id:"calls",t:"21:45",l:"Family Calls",i:"📞",d:"Max 30 minutes.",a:"#2A9D5C"},
    {id:"report",t:"22:00",l:"Night Report",i:"📋",d:"Fill app. Log everything.",a:"#2563EB"},
    {id:"sleep",t:"22:15",l:"Lights Out",i:"🌙",d:"Phone away. Sleep.",a:"#8A8070"}
  );
  else if(iW) b.push(
    {id:"work",t:"09:00",l:"Work Starts",i:"💻",d:"Sit at desk. No distractions.",a:"#2563EB"},
    {id:"lunch",t:"13:00",l:"Lunch Break",i:"🍽️",d:"30 min away from screen.",a:"#EA580C"},
    {id:"wend",t:"19:00",l:"Work Ends — Hard Stop",i:"✅",d:"Close laptop. Done.",a:"#2A9D5C"},
    {id:"dinner",t:"19:05",l:"Dinner (from fridge)",i:"🍽️",d:"Half carbs. No curd.",a:"#EA580C"},
    {id:"wash2",t:"19:25",l:"Wash Utensils",i:"🧽",d:"10 minutes.",a:"#0D9488"},
    {id:"study",t:"19:35",l:"Study — SAP HCM (2hrs)",i:"📚",d:"Trainer video + notes.",a:"#7C3AED"},
    {id:"calls",t:"21:35",l:"Family Calls",i:"📞",d:"Max 30 minutes.",a:"#2A9D5C"},
    {id:"report",t:"22:00",l:"Night Report",i:"📋",d:"Fill app. Log everything.",a:"#2563EB"},
    {id:"sleep",t:"22:15",l:"Lights Out",i:"🌙",d:"Phone away. Sleep.",a:"#8A8070"}
  );
  else b.push(
    {id:"mop",t:"08:15",l:"Mopping (Sat only)",i:"🧹",d:"Full 2BHK. Every Saturday.",a:"#0D9488"},
    {id:"st1",t:"09:00",l:"MBA Study (2 hrs)",i:"📚",d:"Sat = Live. Sun = Revision.",a:"#7C3AED"},
    {id:"lunch",t:"11:30",l:"Lunch",i:"🍽️",d:"Proper meal. Sit and eat.",a:"#EA580C"},
    {id:"free",t:"12:30",l:"Free Time 🎉",i:"😌",d:"Movie, series, calls. Until 3:30 PM.",a:"#2A9D5C"},
    {id:"st2",t:"15:30",l:"SAP HCM (1.5 hrs)",i:"📚",d:"Trainer video. Write notes.",a:"#7C3AED"},
    {id:"walk2",t:"17:00",l:"Evening Walk + Tea",i:"☕",d:"20 min walk. Good tea.",a:"#2A9D5C"},
    {id:"rev",t:"17:30",l:"Weekly Review (Sun)",i:"📋",d:"Sunday only. 20 minutes.",a:"#2563EB"},
    {id:"dinner",t:"19:00",l:"Dinner",i:"🍽️",d:"Half carbs. No curd.",a:"#EA580C"},
    {id:"calls",t:"19:30",l:"Family Calls",i:"📞",d:"Longer window on weekends.",a:"#2A9D5C"},

let D={},curTab='today',selCat='Food',studyOn=null,studyIv=null,studyEl=0;
let openLogId=null,openFoodType=null,foodDev=false,showUnplan=false,showExp=false;
const dow=new Date().getDay(),sched=getSched(dow),fp=FP[dow],sp=SP[dow];

function tKey(){return new Date().toISOString().slice(0,10);}
function now(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function td(){return D[tKey()];}
function load(){
  try{const r=localStorage.getItem(SK);D=r?JSON.parse(r):{};}catch{D={};}
  const k=tKey();
  if(!D[k])D[k]={sc:{},food:[],study:[],h:{cigs:0,gum:0,steps:0,wt:98},fin:[],unp:[]};
  // grocery checks stored separately with week key
  const wk=weekKey();
  if(!D['grocery_'+wk])D['grocery_'+wk]={};
}
function save(){try{localStorage.setItem(SK,JSON.stringify(D));}catch{}}
function weekKey(){const d=new Date();const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);const mon=new Date(d.setDate(diff));return mon.toISOString().slice(0,10);}
function gChecks(){return D['grocery_'+weekKey()]||{};}

function tCal(){return td().food.reduce((s,f)=>s+f.cal,0);}
function tSpent(){return td().fin.reduce((s,e)=>s+e.amt,0);}
function dTasks(){return sched.filter(i=>td().sc[i.id]).length;}
function sMins(){return td().study.reduce((s,x)=>s+x.mins,0);}
function fAdh(){const f=td().food;if(!f.length)return 0;return Math.round(f.filter(x=>!x.dev).length/f.length*100);}
function align(){return Math.round(dTasks()/sched.length*100);}

function uHdr(){
  const d=new Date();

  ['today','food','study','health','finance','insights','grocery'].forEach(t=>{document.getElementById('tab-'+t).classList.toggle('hidden',t!==n);});

    <div class="pt" style="background:rgba(255,255,255,0.5)"><div class="pf" style="width:${Math.min(100,(ts/DB)*100)}%;background:${over?'#E8402A':'#2A9D5C'}"></div></div>
  </div>`;
  if(td().fin.length){
    h+=`<div class="slbl">TODAY'S EXPENSES</div>`;
    td().fin.forEach(e=>{
      const cat=EC[e.cat]||EC.Other;
      h+=`<div class="card" style="display:flex;align-items:center;gap:12px"><div style="font-size:24px">${cat.i}</div><div style="flex:1"><div style="font-size:13px;font-weight:500">${e.desc}</div><div style="display:flex;gap:6px;margin-top:4px;align-items:center"><span class="pill" style="background:${cat.c}18;color:${cat.c}">${e.cat}</span><span style="font-size:9px;color:#C5BFB0">${e.time}</span></div></div><div style="font-size:15px;font-weight:800;color:#E8402A">₹${e.amt}</div></div>`;
    });
  }
  if(showExp){
    const cb=Object.entries(EC).map(([cat,{c}])=>`<button class="cbtn${selCat===cat?' selected':''}" style="${selCat===cat?`background:${c};color:#fff;border-color:${c}`:''};" onclick="selCat='${cat}';rFinance()">${cat}</button>`).join('');
    h+=`<div class="iform" style="margin-top:8px">
      <div style="font-size:9px;color:#E8402A;letter-spacing:2px;font-weight:700;margin-bottom:10px">LOG EXPENSE</div>
      <label class="flbl">WHAT DID YOU SPEND ON?</label>
      <input type="text" id="ed" placeholder="e.g. Petrol, groceries, chai" style="margin-bottom:10px">
      <label class="flbl">AMOUNT (₹)</label>
      <input type="number" id="ea" placeholder="e.g. 150" style="margin-bottom:12px">
      <label class="flbl" style="margin-bottom:8px">CATEGORY</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">${cb}</div>
      <div class="brow"><button class="bp" style="background:#E8402A" onclick="logExp()">LOG ✓</button><button class="bs" onclick="showExp=false;rFinance()">CANCEL</button></div>
    </div>`;
  } else {
    h+=`<button class="abtn" style="color:#E8402A;margin-top:4px" onclick="showExp=true;rFinance()">+ LOG EXPENSE</button>`;
  }
  el.innerHTML=h;
}
function logExp(){
  const desc=document.getElementById('ed')?.value.trim();
  const amt=parseInt(document.getElementById('ea')?.value);
  if(!desc||!amt)return;
  const cat=EC[selCat]||EC.Other;
  td().fin.push({desc,amt,cat:selCat,icon:cat.i,time:now()});
  save();showExp=false;rFinance();uHdr();
}

// GROCERY
function rGrocery(){
  const el=document.getElementById('tab-grocery');
  const checks=gChecks();
  const total=GROCERY.reduce((s,g)=>s+g.items.length,0);
  const done=Object.values(checks).filter(Boolean).length;
  let h=`<div class="card" style="background:linear-gradient(135deg,#EDF7F2,#D1FAE5);border-color:#2A9D5C44">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:9px;color:#2A9D5C;letter-spacing:2px;font-weight:700">WEEKLY GROCERY</div>
        <div style="font-size:28px;font-weight:800;color:#1A1814">${done}/${total}</div>
        <div style="font-size:10px;color:#8A8070">items added to cart</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:#2A9D5C;font-weight:700">Est. ₹900–1,200</div>
        <div style="font-size:9px;color:#8A8070;margin-top:4px">Blinkit order</div>
        <button style="margin-top:8px;background:#2A9D5C;border:none;border-radius:8px;color:#fff;padding:8px 14px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-appearance:none" onclick="resetGrocery()">Reset List</button>
      </div>
    </div>
    <div class="pt" style="background:rgba(255,255,255,0.5);margin-top:10px">
      <div class="pf" style="width:${Math.min(100,(done/total)*100)}%;background:#2A9D5C"></div>
    </div>
  </div>
  <div style="background:#FFFBEB;border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:11px;color:#D97706;font-weight:600">
    🛒 Tap each item to mark as added to Blinkit cart. List resets every week automatically.
  </div>`;

  GROCERY.forEach((cat,ci)=>{
    h+=`<div class="gcat">
      <div class="gcat-hdr" style="color:${cat.color};background:${cat.bg}">${cat.cat}</div>`;
    cat.items.forEach((item,ii)=>{
      const key=`${ci}_${ii}`;
      const checked=!!checks[key];
      h+=`<div class="gitem${checked?' checked':''}" onclick="toggleGrocery('${key}')">
        <div class="gcheck">${checked?'✓':''}</div>
        <div class="gname">${item.n}</div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="gqty">${item.q}</div>
          ${item.flag?`<span class="gflag">${item.flag}</span>`:''}
        </div>
      </div>`;
    });
    h+='</div>';
  });
  el.innerHTML=h;
}
function toggleGrocery(key){
  const wk='grocery_'+weekKey();
  if(!D[wk])D[wk]={};
  D[wk][key]=!D[wk][key];
  save();rGrocery();
}
function resetGrocery(){
  if(confirm('Reset grocery list? All ticks will be cleared.')){
    D['grocery_'+weekKey()]={};
    save();rGrocery();
  }
}

// INSIGHTS
function rInsights(){
  const el=document.getElementById('tab-insights');
  const al=align(),tc=tCal(),ts=tSpent(),h=td().h,sm=sMins(),fa=fAdh();
  const ac=al>=80?'#2A9D5C':al>=60?'#D97706':'#E8402A';
  const late=sched.filter(i=>td().sc[i.id]?.status==='late').length;
  const w=td().sc['wake'];
  let htm=`<div class="card" style="background:${ac}15;border:1.5px solid ${ac}44;text-align:center;padding:24px 16px">
    <div style="font-size:9px;color:${ac};letter-spacing:3px;font-weight:700;margin-bottom:8px">TODAY'S ALIGNMENT</div>
    <div style="font-size:64px;font-weight:800;color:${ac};line-height:1">${al}%</div>
    <div style="font-size:13px;color:#8A8070;margin-top:8px">${dTasks()} of ${sched.length} tasks · ${late} ran late</div>
    <div style="background:rgba(255,255,255,0.6);border-radius:8px;height:8px;margin-top:12px">
      <div style="height:8px;border-radius:8px;width:${al}%;background:${ac};transition:width 0.5s"></div>
    </div>
  </div>
  <div class="slbl" style="margin-top:16px">BREAKDOWN</div>`;
  [{l:'Calories',v:`${tc}`,n:`Target ${TC} · ${Math.max(0,TC-tc)} remaining`,c:tc<=TC?'#2A9D5C':'#E8402A'},
   {l:'Food Adherence',v:`${fa}%`,n:`${td().food.filter(f=>!f.dev).length} on-plan · ${td().food.filter(f=>f.dev).length} deviated`,c:fa>=80?'#2A9D5C':'#D97706'},
   {l:'Study',v:`${sm}m`,n:`${sp.s} · target 60min`,c:sm>=60?'#2A9D5C':sm>0?'#D97706':'#E8402A'},
   {l:'Money Spent',v:`₹${ts}`,n:`Budget ₹${DB}/day`,c:ts<=DB?'#2A9D5C':'#E8402A'},
   {l:'Cigarettes',v:String(h.cigs),n:'Target ≤ 4 today',c:h.cigs<=4?'#2A9D5C':'#E8402A'},
   {l:'Nicotine Gum',v:String(h.gum||0),n:'Use before every craving',c:'#0D9488'},
   {l:'Steps',v:(h.steps||0).toLocaleString(),n:'Target 6,000+',c:(h.steps||0)>=6000?'#2A9D5C':'#D97706'},
  ].forEach(({l,v,n,c})=>{
    htm+=`<div class="irow"><div><div style="font-size:13px;font-weight:500">${l}</div><div style="font-size:10px;color:#8A8070;margin-top:2px">${n}</div></div><div style="font-size:18px;font-weight:800;color:${c};flex-shrink:0;margin-left:12px">${v}</div></div>`;
  });
  const verdict=al>=80&&tc<=TC&&h.cigs<=4?'🌟 Outstanding day. High alignment, calories controlled, smoking on target.'
    :al>=60?`✅ Acceptable. ${late>0?`${late} task(s) late. `:''}${tc>TC?`Calories over by ${tc-TC}. `:''}${h.cigs>4?'Cigs over target. ':''}Tighten tomorrow.`
    :'⚠️ Below threshold. Something broke. Identify it before sleeping. Reset tomorrow.';
  htm+=`<div class="card" style="margin-top:16px;background:${al>=60?'#EDF7F2':'#FEF0ED'};border-color:${al>=60?'#2A9D5C':'#E8402A'}44">
    <div style="font-size:9px;color:${al>=60?'#2A9D5C':'#E8402A'};letter-spacing:2px;font-weight:700;margin-bottom:8px">TODAY'S VERDICT</div>
    <div style="font-size:13px;color:#1A1814;line-height:1.8">${verdict}</div>
  </div>
  <div class="card" style="margin-top:10px;background:#EFF6FF;border-color:#2563EB44">
    <div style="font-size:9px;color:#2563EB;letter-spacing:2px;font-weight:700;margin-bottom:10px">📋 NIGHTLY REPORT — COPY + SEND</div>
    <div class="rbox">
Wake:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${w?.time||'___'}<br>
Walk:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${td().sc['walk']?'Y ✓':'N'}<br>
Breakfast:&nbsp;${td().sc['bfast']?'Y ✓':'N'}<br>
Study:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${sm>0?`Y · ${sp.s} · ${sm}min`:'N'}<br>
Cigs:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${h.cigs}<br>
Gum:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${h.gum||0} pieces<br>
Calories:&nbsp;&nbsp;${tc}<br>
Spent:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;₹${ts}<br>
Steps:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${(h.steps||0).toLocaleString()}<br>
Alignment:&nbsp;${al}%
    </div>
  </div>`;
  el.innerHTML=htm;
}

load();rToday();uHdr();
</script>
