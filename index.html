function tKey(){return new Date().toISOString().slice(0,10);}
function now(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function td(){return D[tKey()];}
function weekKey(){const d=new Date();const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);const mon=new Date(new Date().setDate(new Date().getDate()-new Date().getDay()+(new Date().getDay()===0?-6:1)));return mon.toISOString().slice(0,10);}
function gData(){const k='g_'+weekKey();if(!D[k])D[k]={checks:{},prices:{}};return D[k];}

function load(){
  try{const r=localStorage.getItem(SK);D=r?JSON.parse(r):{};}catch{D={};}
  const k=tKey();
  if(!D[k])D[k]={sc:{},food:[],study:[],h:{cigs:0,gum:0,steps:0,wt:98},fin:[],unp:[]};
  gData();
  mData();
  // Set June budget
  const mk='monthbudget_'+monthKey();
  if(!D[mk])D[mk]={daily:61};
}
function save(){try{localStorage.setItem(SK,JSON.stringify(D));}catch{}}

function tCal(){return td().food.reduce((s,f)=>s+f.cal,0);}
function tSpent(){return td().fin.reduce((s,e)=>s+e.amt,0);}
function dTasks(){return sched.filter(i=>td().sc[i.id]).length;}
function sMins(){return td().study.reduce((s,x)=>s+x.mins,0);}
function fAdh(){const f=td().food;if(!f.length)return 0;return Math.round(f.filter(x=>!x.dev).length/f.length*100);}
function align(){return Math.round(dTasks()/sched.length*100);}
function gTotal(){const gd=gData();return Object.values(gd.prices).reduce((s,v)=>s+(parseFloat(v)||0),0);}
function gChecked(){return Object.values(gData().checks).filter(Boolean).length;}
function gAll(){return GROCERY.reduce((s,c)=>s+c.items.length,0);}

function uHdr(){
  const d=new Date();
  document.getElementById('hDate').textContent=`${DNS[dow]}, ${d.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}`;
  document.getElementById('hQuote').textContent=QT[dow];
  document.getElementById('bDate').textContent=`SUMESH LIFE OS · ${d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`;
  const al=align(),ac=al>=80?'#2A9D5C':al>=60?'#D97706':'#E8402A';
  document.getElementById('aPct').textContent=al+'%';
  document.getElementById('aPct').style.color=ac;
  document.getElementById('aCircle').style.borderColor=ac;
  const tc=tCal(),ts=tSpent(),h=td().h;
  document.getElementById('sTasks').textContent=dTasks()+'/'+sched.length;
  document.getElementById('sTasks').style.color='#2563EB';
  document.getElementById('sCal').textContent=tc;
  document.getElementById('sCal').style.color=tc>TC?'#E8402A':'#2A9D5C';
  document.getElementById('sSpent').textContent='₹'+ts;
  document.getElementById('sSpent').style.color=ts>DB?'#E8402A':'#2A9D5C';
  document.getElementById('sCigs').textContent=h.cigs;
  document.getElementById('sCigs').style.color=h.cigs<=4?'#2A9D5C':'#E8402A';
  document.getElementById('sGum').textContent=h.gum||0;
  document.getElementById('sGum').style.color='#0D9488';
}

function showTab(n){
  curTab=n;
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',['today','food','study','health','finance','insights','grocery'][i]===n);});
  ['today','food','study','health','finance','insights','grocery'].forEach(t=>{document.getElementById('tab-'+t).classList.toggle('hidden',t!==n);});
  render(n);
}
function render(n){
  if(n==='today')rToday();
  else if(n==='food')rFood();
  else if(n==='study')rStudy();
  else if(n==='health')rHealth();
  else if(n==='finance')rFinance();
  else if(n==='insights')rInsights();
  else if(n==='grocery')rGrocery();
  uHdr();
}

  sched.forEach(item=>{

  });

  td().unp.forEach(u=>{h+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;background:#FFFBEB;border-color:rgba(217,119,6,0.3)"><div><div style="font-size:13px;font-weight:600">${u.l}</div>${u.n?`<div style="font-size:10px;color:#8A8070">${u.n}</div>`:''}</div><div style="font-size:10px;color:#D97706;font-weight:700">${u.t}</div></div>`;});

  }
  h+='</div>';
  el.innerHTML=h;

function toggleLog(id){openLogId=openLogId===id?null:id;rToday();}
function cancelLog(){openLogId=null;rToday();}
function confirmLog(id){
  const timeVal=document.getElementById('lt_'+id)?.value||now();
  const note=document.getElementById('ln_'+id)?.value||'';
  const item=sched.find(i=>i.id===id);
  td().sc[id]={time:timeVal,note,status:timeVal<=item.t?'on-time':'late'};
  save();openLogId=null;rToday();uHdr();
}
function logUnplan(){
  const l=document.getElementById('ul')?.value.trim();
  const n=document.getElementById('un')?.value.trim()||'';
  if(!l)return;
  td().unp.push({l,n,t:now()});
  save();showUnplan=false;rToday();
}

      if(!foodDev){

function uCalc(key,ac){const g=parseFloat(document.getElementById('fg')?.value)||0;const plan=fp[key];const el=document.getElementById('calShow');if(el&&plan)el.textContent=`= ~${Math.round(plan.c*g)} calories`;}
function toggleFood(type){openFoodType=openFoodType===type?null:type;foodDev=false;rFood();}
function cancelFood(){openFoodType=null;foodDev=false;rFood();}
function confirmFood(type,key){const g=parseFloat(document.getElementById('fg')?.value);if(!g)return;const plan=fp[key];td().food.push({type,name:plan.n,grams:g,cal:Math.round(plan.c*g),time:now(),dev:false});save();cancelFood();}
function confirmFoodDev(type){const name=document.getElementById('fn')?.value.trim();const grams=parseFloat(document.getElementById('fg2')?.value);const calIn=parseInt(document.getElementById('fc')?.value)||0;if(!name||!grams)return;td().food.push({type,name,grams,cal:calIn||Math.round(grams*1.5),time:now(),dev:true});save();cancelFood();}

function startStudy(){studyOn={st:now(),ts:Date.now()};studyIv=setInterval(()=>{studyEl=Math.floor((Date.now()-studyOn.ts)/1000);rStudy();},1000);rStudy();}
function stopStudy(){if(!studyOn)return;clearInterval(studyIv);studyIv=null;const mins=Math.round(studyEl/60);td().study.push({sub:sp.s,topic:sp.t,start:studyOn.st,end:now(),mins});save();studyOn=null;studyEl=0;rStudy();uHdr();}

function uH(k,d){const h=td().h;h[k]=Math.max(0,parseFloat(((h[k]||0)+d).toFixed(2)));save();rHealth();uHdr();}
function uW(d){const h=td().h;h.wt=parseFloat(((h.wt||98)+d).toFixed(1));save();rHealth();}

// Finance helpers
function getDailyBudget(){
  const mk2='monthbudget_'+monthKey();
  const mb=D[mk2];
  if(mb&&mb.daily) return mb.daily;
  return 107;
}
function monthKey(){const d=new Date();return `${d.getFullYear()}_${d.getMonth()+1}`;}
function mData(){const k='month_'+monthKey();if(!D[k])D[k]={cc:[]};return D[k];}
function ccTotal(){return mData().cc.reduce((s,e)=>s+e.amt,0);}
function ccBudgetUsed(){
  // what % of next salary is already committed
  return Math.round((ccTotal()/92000)*100);
}

  const cc=mData().cc,cct=ccTotal();
  let h=`
  <!-- Monthly budget setup -->
  <div class="card" style="background:#F5F3FF;border-color:#7C3AED44;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center">

        <div style="font-size:9px;color:#7C3AED;letter-spacing:2px;font-weight:700">JUNE DAILY BUDGET</div>
        <div style="font-size:28px;font-weight:800;color:#7C3AED">₹${db}<span style="font-size:13px;color:#8A8070">/day</span></div>
        <div style="font-size:10px;color:#8A8070">After petrol + groceries deducted</div>
      </div>
      <button style="background:#7C3AED;border:none;border-radius:8px;color:#fff;padding:8px 12px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-appearance:none" onclick="showBudgetSetup()">Update</button>
    </div>
  </div>

  <!-- Daily cash summary -->
  <div class="card" style="background:linear-gradient(135deg,${over?'#FEF0ED,#FEE2DD':'#EDF7F2,#D1FAE5'});border-color:${over?'#E8402A':'#2A9D5C'}44">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="font-size:9px;color:${over?'#E8402A':'#2A9D5C'};letter-spacing:2px;font-weight:700">CASH SPENT TODAY</div>
        <div style="font-size:30px;font-weight:800;color:${over?'#E8402A':'#1A1814'}">₹${ts}</div>
        <div style="font-size:10px;color:#8A8070">Daily budget ₹${db}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:9px;color:#C5BFB0;letter-spacing:2px">REMAINING</div>
        <div style="font-size:30px;font-weight:800;color:${over?'#E8402A':'#2A9D5C'}">₹${Math.max(0,db-ts)}</div>
        <div style="font-size:10px;color:${over?'#E8402A':'#8A8070'}">${over?'OVER BUDGET ⚠️':'left today'}</div>
      </div>
    </div>
    <div class="pt" style="background:rgba(255,255,255,0.5)"><div class="pf" style="width:${Math.min(100,(ts/db)*100)}%;background:${over?'#E8402A':'#2A9D5C'}"></div></div>
  </div>`;

  // Cash expenses today
  if(td().fin.length){
    h+=`<div class="slbl">CASH EXPENSES TODAY</div>`;
    td().fin.forEach(e=>{
      const cat=EC[e.cat]||EC.Other;
      h+=`<div class="card" style="display:flex;align-items:center;gap:12px"><div style="font-size:24px">${cat.i}</div><div style="flex:1"><div style="font-size:13px;font-weight:500">${e.desc}</div><div style="display:flex;gap:6px;margin-top:4px;align-items:center"><span class="pill" style="background:${cat.c}18;color:${cat.c}">${e.cat}</span><span style="font-size:9px;color:#C5BFB0">${e.time}</span></div></div><div style="font-size:15px;font-weight:800;color:#E8402A">₹${e.amt}</div></div>`;
    });
  }

  // Credit card section
  h+=`
  <div class="card" style="background:linear-gradient(135deg,#EFF6FF,#DBEAFE);border-color:#2563EB44;margin-top:6px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
      <div>
        <div style="font-size:9px;color:#2563EB;letter-spacing:2px;font-weight:700">ICICI CREDIT CARD</div>
        <div style="font-size:28px;font-weight:800;color:#2563EB">₹${cct.toLocaleString()}</div>
        <div style="font-size:10px;color:#8A8070">Due by 8 July · Limit ₹4,30,000</div>
        <div style="font-size:11px;color:${ccBudgetUsed()>30?'#E8402A':'#2563EB'};font-weight:700;margin-top:4px">${ccBudgetUsed()}% of July salary committed</div>
      </div>
      <button style="background:#2563EB;border:none;border-radius:8px;color:#fff;padding:8px 12px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-appearance:none" onclick="showCC=true;rFinance()">+ Add</button>
    </div>
    <div class="pt" style="background:rgba(255,255,255,0.5)"><div class="pf" style="width:${Math.min(100,ccBudgetUsed()*3)}%;background:${ccBudgetUsed()>30?'#E8402A':'#2563EB'}"></div></div>
  </div>`;

  // CC expenses this month
  if(cc.length){
    h+=`<div class="slbl">CREDIT CARD THIS MONTH</div>`;
    cc.forEach(e=>{
      const cat=EC[e.cat]||EC.Other;
      h+=`<div class="card" style="display:flex;align-items:center;gap:12px;border-left:3px solid #2563EB"><div style="font-size:24px">${cat.i}</div><div style="flex:1"><div style="font-size:13px;font-weight:500">${e.desc}</div><div style="display:flex;gap:6px;margin-top:4px;align-items:center"><span class="pill" style="background:#EFF6FF;color:#2563EB">CREDIT CARD</span><span style="font-size:9px;color:#C5BFB0">${e.date}</span></div></div><div style="font-size:15px;font-weight:800;color:#2563EB">₹${e.amt}</div></div>`;
    });
  }

  // Add CC expense form
  if(showCC){
    h+=`<div class="iform" style="border-color:#2563EB44">
      <div style="font-size:9px;color:#2563EB;letter-spacing:2px;font-weight:700;margin-bottom:10px">LOG CREDIT CARD EXPENSE</div>
      <div style="background:#FFFBEB;border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:11px;color:#D97706;font-weight:600">⚠️ Necessary purchases only. This reduces July salary available.</div>
      <label class="flbl">WHAT DID YOU BUY?</label>
      <input type="text" id="ccd" placeholder="e.g. Groceries - Blinkit" style="margin-bottom:10px">
      <label class="flbl">AMOUNT (₹)</label>
      <input type="number" id="cca" placeholder="e.g. 950" style="margin-bottom:12px">
      <label class="flbl" style="margin-bottom:8px">CATEGORY</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
        ${Object.entries(EC).map(([cat,{c}])=>`<button class="cbtn${selCCCat===cat?' selected':''}" style="${selCCCat===cat?`background:${c};color:#fff;border-color:${c}`:''};" onclick="selCCCat='${cat}';rFinance()">${cat}</button>`).join('')}
      </div>
      <div class="brow">
        <button class="bp" style="background:#2563EB" onclick="logCC()">LOG ✓</button>
        <button class="bs" onclick="showCC=false;rFinance()">CANCEL</button>
      </div>
    </div>`;
  }

  // Add cash expense form
  if(showExp){
    const cb=Object.entries(EC).map(([cat,{c}])=>`<button class="cbtn${selCat===cat?' selected':''}" style="${selCat===cat?`background:${c};color:#fff;border-color:${c}`:''};" onclick="selCat='${cat}';rFinance()">${cat}</button>`).join('');
    h+=`<div class="iform" style="margin-top:8px"><div style="font-size:9px;color:#E8402A;letter-spacing:2px;font-weight:700;margin-bottom:10px">LOG CASH EXPENSE</div><label class="flbl">WHAT DID YOU SPEND ON?</label><input type="text" id="ed" placeholder="e.g. Petrol, chai" style="margin-bottom:10px"><label class="flbl">AMOUNT (₹)</label><input type="number" id="ea" placeholder="e.g. 150" style="margin-bottom:12px"><label class="flbl" style="margin-bottom:8px">CATEGORY</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">${cb}</div><div class="brow"><button class="bp" style="background:#E8402A" onclick="logExp()">LOG ✓</button><button class="bs" onclick="showExp=false;rFinance()">CANCEL</button></div></div>`;
  } else {
    h+=`<div style="display:flex;gap:8px;margin-top:8px">
      <button class="abtn" style="color:#E8402A" onclick="showExp=true;showCC=false;rFinance()">+ CASH EXPENSE</button>
      <button class="abtn" style="color:#2563EB" onclick="showCC=true;showExp=false;rFinance()">+ CREDIT CARD</button>
    </div>`;
  }
  el.innerHTML=h;
}

function showBudgetSetup(){
  const amt=prompt('Enter your daily budget for this month (₹):','107');
  if(amt&&!isNaN(amt)){
    const k='monthbudget_'+monthKey();
    if(!D[k])D[k]={};
    D[k].daily=parseInt(amt);
    save();rFinance();
  }
}

function logExp(){
  const desc=document.getElementById('ed')?.value.trim();
  const amt=parseInt(document.getElementById('ea')?.value);
  if(!desc||!amt)return;
  const cat=EC[selCat]||EC.Other;
  td().fin.push({desc,amt,cat:selCat,icon:cat.i,time:now()});
  save();showExp=false;rFinance();uHdr();
}

function logCC(){
  const desc=document.getElementById('ccd')?.value.trim();
  const amt=parseInt(document.getElementById('cca')?.value);
  if(!desc||!amt)return;
  const cat=EC[selCCCat]||EC.Other;
  const d=new Date();
  mData().cc.push({desc,amt,cat:selCCCat,icon:cat.i,date:`${d.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}`});
  save();showCC=false;rFinance();
}

// GROCERY
function rGrocery(){
  const el=document.getElementById('tab-grocery');
  const gd=gData();
  const total=gAll(),done=gChecked(),gt=gTotal();
  let h=`<div class="card" style="background:linear-gradient(135deg,#EDF7F2,#D1FAE5);border-color:#2A9D5C44">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-size:9px;color:#2A9D5C;letter-spacing:2px;font-weight:700">WEEKLY GROCERY</div>
        <div style="font-size:28px;font-weight:800">${done}/${total} items</div>
        <div style="font-size:10px;color:#8A8070">ticked for Blinkit</div>
        ${gt>0?`<div style="font-size:14px;color:#2A9D5C;font-weight:700;margin-top:6px">Total entered: ₹${gt.toFixed(0)}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        ${gt>0?`<button style="background:#2A9D5C;border:none;border-radius:8px;color:#fff;padding:9px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-appearance:none" onclick="addGroceryToFinance()">→ Add ₹${gt.toFixed(0)} to Finance</button>`:''}
        <button style="background:#fff;border:1.5px solid #EDE9E0;border-radius:8px;color:#8A8070;padding:7px 12px;font-size:10px;cursor:pointer;font-family:inherit;-webkit-appearance:none" onclick="resetGrocery()">Reset Week</button>
      </div>
    </div>
    <div class="pt" style="background:rgba(255,255,255,0.5);margin-top:10px"><div class="pf" style="width:${Math.min(100,(done/total)*100)}%;background:#2A9D5C"></div></div>
  </div>
  <div style="background:#EFF6FF;border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:11px;color:#2563EB;font-weight:600">
    📱 Tap item to tick · Enter price after ordering · Tap "Add to Finance" when done
  </div>`;

  GROCERY.forEach((cat,ci)=>{
    h+=`<div class="gcat"><div class="gcat-hdr" style="color:${cat.color};background:${cat.bg}">${cat.cat}</div>`;
    cat.items.forEach((item,ii)=>{
      const key=`${ci}_${ii}`;
      const checked=!!gd.checks[key];
      const price=gd.prices[key]||'';
      const isMonthly=!!item.monthly;
      h+=`<div class="gitem${checked?' checked':''}${isMonthly?' monthly':''}">
        <div class="grow" onclick="toggleGrocery('${key}')">
          <div class="gcheck">${checked?'✓':''}</div>
          <div style="flex:1">
            <div class="gname">${item.n}</div>
            <div class="gdish">${item.dishes}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
            <div class="gqty">${item.q}</div>
            ${item.flag?`<span class="gflag" style="background:#FEF0ED;color:#E8402A">${item.flag}</span>`:''}
            ${isMonthly?`<span class="gflag" style="background:#F5F3FF;color:#7C3AED">Monthly</span>`:''}
          </div>
        </div>
        <div class="gprice-row">
          <div class="gprice-lbl">Price paid (₹)</div>
          <input class="gprice-input" type="number" placeholder="0" value="${price}" onchange="setPrice('${key}',this.value)" onclick="event.stopPropagation()">
        </div>
      </div>`;
    });
    h+='</div>';
  });
  el.innerHTML=h;
}
function toggleGrocery(key){const gd=gData();gd.checks[key]=!gd.checks[key];save();rGrocery();}
function setPrice(key,val){const gd=gData();gd.prices[key]=val;save();
  // update total display without full re-render
  const gt=gTotal();
  rGrocery();
}
function addGroceryToFinance(){
  const gt=gTotal();
  if(gt<=0)return;
  td().fin.push({desc:'Weekly Groceries — Blinkit',amt:Math.round(gt),cat:'Groceries',icon:'🛒',time:now()});
  save();
  alert(`₹${Math.round(gt)} added to Finance as Weekly Groceries!`);
  uHdr();
}
function resetGrocery(){
  if(confirm('Reset this week\'s grocery list?')){
    const k='g_'+weekKey();
    D[k]={checks:{},prices:{}};
    save();rGrocery();
  }
}

function rInsights(){
  const el=document.getElementById('tab-insights');
  const al=align(),tc=tCal(),ts=tSpent(),h=td().h,sm=sMins(),fa=fAdh();
  const ac=al>=80?'#2A9D5C':al>=60?'#D97706':'#E8402A';
  const late=sched.filter(i=>td().sc[i.id]?.status==='late').length;
  const w=td().sc['wake'];
  let htm=`<div class="card" style="background:${ac}15;border:1.5px solid ${ac}44;text-align:center;padding:24px 16px"><div style="font-size:9px;color:${ac};letter-spacing:3px;font-weight:700;margin-bottom:8px">TODAY'S ALIGNMENT</div><div style="font-size:64px;font-weight:800;color:${ac};line-height:1">${al}%</div><div style="font-size:13px;color:#8A8070;margin-top:8px">${dTasks()} of ${sched.length} tasks · ${late} ran late</div><div style="background:rgba(255,255,255,0.6);border-radius:8px;height:8px;margin-top:12px"><div style="height:8px;border-radius:8px;width:${al}%;background:${ac};transition:width 0.5s"></div></div></div><div class="slbl" style="margin-top:16px">BREAKDOWN</div>`;
  [{l:'Calories',v:`${tc}`,n:`Target ${TC} · ${Math.max(0,TC-tc)} remaining`,c:tc<=TC?'#2A9D5C':'#E8402A'},{l:'Food Adherence',v:`${fa}%`,n:`${td().food.filter(f=>!f.dev).length} on-plan · ${td().food.filter(f=>f.dev).length} deviated`,c:fa>=80?'#2A9D5C':'#D97706'},{l:'Study',v:`${sm}m`,n:`${sp.s} · target 60min`,c:sm>=60?'#2A9D5C':sm>0?'#D97706':'#E8402A'},{l:'Money Spent',v:`₹${ts}`,n:`Budget ₹${DB}/day`,c:ts<=DB?'#2A9D5C':'#E8402A'},{l:'Cigarettes',v:String(h.cigs),n:'Target ≤ 4 today',c:h.cigs<=4?'#2A9D5C':'#E8402A'},{l:'Nicotine Gum',v:String(h.gum||0),n:'Use before every craving',c:'#0D9488'},{l:'Steps',v:(h.steps||0).toLocaleString(),n:'Target 6,000+',c:(h.steps||0)>=6000?'#2A9D5C':'#D97706'}].forEach(({l,v,n,c})=>{htm+=`<div class="irow"><div><div style="font-size:13px;font-weight:500">${l}</div><div style="font-size:10px;color:#8A8070;margin-top:2px">${n}</div></div><div style="font-size:18px;font-weight:800;color:${c};flex-shrink:0;margin-left:12px">${v}</div></div>`;});
  const verdict=al>=80&&tc<=TC&&h.cigs<=4?'🌟 Outstanding day. High alignment, calories controlled, smoking on target.':al>=60?`✅ Acceptable. ${late>0?`${late} task(s) late. `:''}${tc>TC?`Calories over by ${tc-TC}. `:''}${h.cigs>4?'Cigs over target. ':''}Tighten tomorrow.`:'⚠️ Below threshold. Something broke. Identify it before sleeping. Reset tomorrow.';
  htm+=`<div class="card" style="margin-top:16px;background:${al>=60?'#EDF7F2':'#FEF0ED'};border-color:${al>=60?'#2A9D5C':'#E8402A'}44"><div style="font-size:9px;color:${al>=60?'#2A9D5C':'#E8402A'};letter-spacing:2px;font-weight:700;margin-bottom:8px">TODAY'S VERDICT</div><div style="font-size:13px;color:#1A1814;line-height:1.8">${verdict}</div></div><div class="card" style="margin-top:10px;background:#EFF6FF;border-color:#2563EB44"><div style="font-size:9px;color:#2563EB;letter-spacing:2px;font-weight:700;margin-bottom:10px">📋 NIGHTLY REPORT — COPY + SEND</div><div class="rbox">Wake:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${w?.time||'___'}<br>Walk:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${td().sc['walk']?'Y ✓':'N'}<br>Breakfast:&nbsp;${td().sc['bfast']?'Y ✓':'N'}<br>Study:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${sm>0?`Y · ${sp.s} · ${sm}min`:'N'}<br>Cigs:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${h.cigs}<br>Gum:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${h.gum||0} pieces<br>Calories:&nbsp;&nbsp;${tc}<br>Spent:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;₹${ts}<br>Steps:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${(h.steps||0).toLocaleString()}<br>Alignment:&nbsp;${al}%</div></div>`;
  el.innerHTML=htm;
}

load();rToday();uHdr();
</script>
</body>
</html>
